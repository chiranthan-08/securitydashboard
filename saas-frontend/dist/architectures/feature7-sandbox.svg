<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#081026"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)" rx="16"/>
  <rect width="958" height="538" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="2" rx="15"/>

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90" />
    <line x1="0" y1="180" x2="960" y2="180" />
    <line x1="0" y1="270" x2="960" y2="270" />
    <line x1="0" y1="360" x2="960" y2="360" />
    <line x1="0" y1="450" x2="960" y2="450" />
    <line x1="160" y1="0" x2="160" y2="540" />
    <line x1="320" y1="0" x2="320" y2="540" />
    <line x1="480" y1="0" x2="480" y2="540" />
    <line x1="640" y1="0" x2="640" y2="540" />
    <line x1="800" y1="0" x2="800" y2="540" />
  </g>

  <!-- Header -->
  <g transform="translate(40, 45)">
    <rect width="180" height="26" rx="6" fill="#0369a1" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1"/>
    <text x="90" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">FEATURE 7 ARCHITECTURE</text>
    <text x="200" y="19" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Pre-Flight Policy Sandbox &amp; GitOps Drift Watchdog</text>
  </g>

  <!-- Flow Boxes -->
  <!-- Box 1: Admin Policy Draft -->
  <g transform="translate(40, 110)">
    <rect width="200" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="180" height="36" x="10" y="12" rx="8" fill="#1e293b"/>
    <text x="100" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. Policy Authoring</text>
    <text x="20" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">INPUT RULE DRAFT:</text>
    <rect width="170" height="60" x="15" y="90" rx="6" fill="#020617" stroke="#1e293b"/>
    <text x="25" y="112" fill="#38bdf8" font-family="monospace" font-size="10">mask_internal_ip: true</text>
    <text x="25" y="128" fill="#a855f7" font-family="monospace" font-size="10">max_entropy: 4.2</text>
    <text x="25" y="142" fill="#22c55e" font-family="monospace" font-size="10">allow_metrics: ["cpu"]</text>

    <text x="20" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">GITOPS STATE:</text>
    <rect width="170" height="50" x="15" y="195" rx="6" fill="#020617" stroke="#1e293b"/>
    <text x="25" y="215" fill="#cbd5e1" font-family="monospace" font-size="9">Baseline: sha256:4a7e9...</text>
    <text x="25" y="232" fill="#e2e8f0" font-family="monospace" font-size="9">Branch: main (signed)</text>

    <rect width="170" height="32" x="15" y="280" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6"/>
    <text x="100" y="301" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Dry-Run Trigger</text>
  </g>

  <!-- Connector 1 -->
  <g transform="translate(245, 270)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="40,0 32,-5 32,5" fill="#0ea5e9"/>
  </g>

  <!-- Box 2: Sandbox Evaluation Engine -->
  <g transform="translate(290, 110)">
    <rect width="240" height="340" rx="12" fill="#0b1329" stroke="#0ea5e9" stroke-width="2" filter="url(#glow)"/>
    <rect width="240" height="340" rx="12" fill="#0b1329" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect width="216" height="36" x="12" y="12" rx="8" fill="#0284c7" fill-opacity="0.2"/>
    <text x="120" y="35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2. Replay Simulation Sandbox</text>
    
    <text x="20" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">OFFLINE DATA REPLAY:</text>
    <rect width="205" height="40" x="18" y="90" rx="6" fill="#020617" stroke="#1e293b"/>
    <text x="28" y="115" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">100 Historical Telemetry Frames</text>

    <text x="20" y="155" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">MULTI-RULE PARALLEL EVAL:</text>
    <g transform="translate(18, 165)">
      <rect width="205" height="30" rx="6" fill="#1e293b"/>
      <text x="12" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Regex Sensitivity Scanner</text>
      <rect width="205" height="30" y="38" rx="6" fill="#1e293b"/>
      <text x="12" y="58" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Shannon Entropy Calculator</text>
      <rect width="205" height="30" y="76" rx="6" fill="#1e293b"/>
      <text x="12" y="96" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Canary Honeytoken Checker</text>
    </g>

    <rect width="205" height="36" x="18" y="285" rx="6" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9"/>
    <text x="120" y="308" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Zero Production Risk</text>
  </g>

  <!-- Connector 2 -->
  <g transform="translate(535, 270)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#10b981" stroke-width="2.5"/>
    <polygon points="40,0 32,-5 32,5" fill="#10b981"/>
  </g>

  <!-- Box 3: Blast Radius & Impact Assessment -->
  <g transform="translate(580, 110)">
    <rect width="340" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="316" height="36" x="12" y="12" rx="8" fill="#1e293b"/>
    <text x="170" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. Blast Radius Assessment &amp; Deployment Gate</text>

    <!-- Scorecards inside -->
    <g transform="translate(18, 65)">
      <rect width="145" height="55" rx="8" fill="#020617" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="22" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="700">ALLOWED METRICS</text>
      <text x="14" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">92%</text>

      <rect width="145" height="55" x="160" rx="8" fill="#020617" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="174" y="22" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" font-weight="700">LEAKAGE RISK</text>
      <text x="174" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">0.0%</text>

      <rect width="145" height="55" y="70" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="14" y="92" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">BANDWIDTH SAVED</text>
      <text x="14" y="114" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">74.2%</text>

      <rect width="145" height="55" x="160" y="70" rx="8" fill="#020617" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="174" y="92" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700">REDACTED FIELDS</text>
      <text x="174" y="114" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">24 / 100</text>
    </g>

    <!-- Drift Status Box -->
    <g transform="translate(18, 210)">
      <rect width="305" height="60" rx="8" fill="#020617" stroke="#1e293b"/>
      <circle cx="25" cy="30" r="8" fill="#10b981"/>
      <path d="M21 30 L24 33 L29 27" fill="none" stroke="#000" stroke-width="2"/>
      <text x="42" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">GitOps Configuration Parity: IN-SYNC</text>
      <text x="42" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">No unauthorized drift detected across 12 edge collectors</text>
    </g>

    <rect width="305" height="34" x="18" y="285" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
    <text x="170" y="307" fill="#86efac" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">&#x2714; Approved for Cryptographic Sync to Edge</text>
  </g>

  <!-- Footer note -->
  <g transform="translate(40, 485)">
    <text x="0" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">CICADA Sentinel Architecture Blueprint &bull; Pre-deployment verification prevents accidental PII exposure and detects configuration tampering.</text>
  </g>
</svg>
