  <!-- Footer note -->
  <g transform="translate(40, 485)">
    <text x="0" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">CICADA Sentinel Architecture Blueprint &bull; Reversible remediation adheres to the Autonomous Operations roadmap (Page 8), guaranteeing policy-governed safety.</text>
